[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-security"
version = "0.1.0"
description = "Agentic Security - Defense Framework for Agentjacking Attacks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "OpenClaw Research", email = "research@openclaw.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
    "loguru>=0.6.0",
    "pyyaml>=6.0.0",
    "cryptography>=41.0.0",
    "tokenizers>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "coverage>=7.0.0",
]

[project.scripts]
agentic-security = "agentic_security.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_security*"]

[tool.setuptools.package-data]
agentic_security = ["config/*.json", "schemas/*.json", "models/*.pth"]
